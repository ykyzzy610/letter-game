<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课间抓字母｜大学生摸鱼小游戏【修复版】</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#1a1a2e;color:#fff;height:100vh;overflow:hidden;}
        #gameBox{width:100%;height:100%;position:relative;}
        .letter{
            position:absolute;font-size:42px;font-weight:bold;
            color:#ffe66d;
            user-select:none;
        }
        .panel{
            position:fixed;top:16px;left:16px;z-index:99;
            background:rgba(0,0,0,0.4);padding:12px 20px;border-radius:10px;
        }
        #tip{position:fixed;bottom:20px;width:100%;text-align:center;font-size:18px;color:#aaa;}
        #startBtn{
            position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
            padding:16px 32px;font-size:22px;border:none;border-radius:12px;
            background:#4158d0;color:white;cursor:pointer;z-index:100;
        }
    </style>
</head>
<body>
<div id="gameBox">
    <div class="panel">
        分数：<span id="score">0</span>｜生命：<span id="life">❤️❤️❤️</span>
    </div>
    <div id="tip">按下键盘上出现的字母！按错扣分，漏掉扣生命</div>
    <button id="startBtn">开始游戏</button>
</div>

<script>
const gameBox = document.getElementById('gameBox');
const scoreDom = document.getElementById('score');
const lifeDom = document.getElementById('life');
const startBtn = document.getElementById('startBtn');

let score = 0;
let life = 3;
let isPlaying = false;
let speed = 1;
let spawnTimer;
const lettersPool = []; // 用来保存当前屏幕所有字母对象
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function updateLife(){
    lifeDom.innerText = "❤️".repeat(life)+"🖤".repeat(3-life);
}

// 生成下落字母
function spawnLetter(){
    if(!isPlaying) return;
    const char = letters[Math.floor(Math.random()*letters.length)];
    const div = document.createElement('div');
    div.className = "letter";
    div.innerText = char;
    const w = window.innerWidth;
    const x = Math.random()*(w-100);
    div.style.left = x+"px";
    div.style.top = "-50px";
    gameBox.appendChild(div);

    const letterObj = {
        dom: div,
        char: char,
        top: -50
    }
    lettersPool.push(letterObj);

    function fall(){
        if(!isPlaying || !div.parentElement) return;
        letterObj.top += speed;
        div.style.top = letterObj.top + "px";
        const h = window.innerHeight;
        if(letterObj.top > h){
            // 字母掉落底部，扣生命，移除
            life--;
            updateLife();
            removeLetter(letterObj);
            checkGameOver();
            return;
        }
        requestAnimationFrame(fall);
    }
    fall();
}

// 从数组移除字母
function removeLetter(obj){
    const idx = lettersPool.indexOf(obj);
    if(idx !== -1){
        lettersPool.splice(idx,1);
    }
    if(obj.dom.parentElement){
        obj.dom.remove();
    }
}

// =========全局键盘监听【修复重点】=========
window.addEventListener('keydown', function(e){
    if(!isPlaying) return;
    e.preventDefault();
    const key = e.key.toUpperCase();
    // 找到第一个匹配的字母（优先匹配上面的）
    const target = lettersPool.find(item => item.char === key);
    if(target){
        score +=10;
        scoreDom.innerText = score;
        removeLetter(target);
        speed +=0.03; // 难度提升
    }else{
        // 按错扣5分，可以注释掉不扣分
        score = Math.max(0, score -5);
        scoreDom.innerText = score;
    }
})

function checkGameOver(){
    if(life <=0){
        isPlaying = false;
        clearInterval(spawnTimer);
        alert(`游戏结束！你的分数：${score}\n点确定重新开始`);
        resetGame();
    }
}

function resetGame(){
    score =0;
    life=3;
    speed=1;
    scoreDom.innerText=0;
    updateLife();
    // 清空所有字母
    while(lettersPool.length>0){
        removeLetter(lettersPool[0]);
    }
    startBtn.style.display="block";
}

startBtn.onclick = function(){
    resetGame();
    isPlaying = true;
    startBtn.style.display="none";
    spawnTimer = setInterval(spawnLetter,1200);
}
updateLife();
</script>
</body>
</html>
